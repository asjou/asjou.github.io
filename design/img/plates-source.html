<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0B0C0F}
.plate{display:block;margin:0 0 20px}</style>

<!-- PLATE 1: blinds — light through venetian blinds on a dark wall, smoke drifting. 1800x720 -->
<svg id="blinds" class="plate" width="1800" height="720" viewBox="0 0 1800 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="smoke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.0045" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.92  0 0 0 0 0.94  0 0 0 1.6 -0.55" result="s"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.009" numOctaves="3" seed="3" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer></filter>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15171c"/><stop offset="1" stop-color="#0B0C0F"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef3f4" stop-opacity=".1"/><stop offset=".2" stop-color="#eef3f4" stop-opacity=".7"/><stop offset=".6" stop-color="#cfe2dc" stop-opacity=".35"/><stop offset="1" stop-color="#cfe2dc" stop-opacity="0"/></linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
    <mask id="fade"><rect width="1800" height="720" fill="url(#fadeg)"/><linearGradient id="fadeg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient></mask>
  </defs>
  <rect width="1800" height="720" fill="url(#wall)"/>
  <radialGradient id="win" cx="12%" cy="18%" r="55%"><stop offset="0" stop-color="#cfe2dc" stop-opacity=".22"/><stop offset="1" stop-color="#cfe2dc" stop-opacity="0"/></radialGradient>
  <rect width="1800" height="720" fill="url(#win)"/>
  <!-- slats: 9 tilted bands of light -->
  <g transform="rotate(-11 900 360)" filter="url(#warp)" opacity=".62">
    <g id="slats">
      <rect x="-400" y="-120" width="2600" height="26" fill="url(#beam)"/>
      <rect x="-400" y="-10" width="2600" height="26" fill="url(#beam)"/>
      <rect x="-400" y="100" width="2600" height="26" fill="url(#beam)"/>
      <rect x="-400" y="210" width="2600" height="26" fill="url(#beam)"/>
      <rect x="-400" y="320" width="2600" height="26" fill="url(#beam)"/>
      <rect x="-400" y="430" width="2600" height="26" fill="url(#beam)"/>
      <rect x="-400" y="540" width="2600" height="26" fill="url(#beam)"/>
      <rect x="-400" y="650" width="2600" height="26" fill="url(#beam)"/>
      <rect x="-400" y="760" width="2600" height="26" fill="url(#beam)"/>
      <rect x="-400" y="870" width="2600" height="26" fill="url(#beam)"/>
    </g>
  </g>
  <!-- crisp slats on top, lower opacity, for definition -->
  <g transform="rotate(-11 900 360)" filter="url(#soft)" opacity=".22">
    <use href="#slats"/>
  </g>
  <!-- smoke -->
  <rect width="1800" height="720" filter="url(#smoke)" opacity=".32" style="mix-blend-mode:screen"/>
  <rect width="1800" height="720" fill="url(#vig)"/>
  <rect width="1800" height="720" filter="url(#grain)" style="mix-blend-mode:overlay"/>
</svg>

<!-- PLATE 2: lamp — a cone of light from a desk lamp, top centre, dust in the beam. 1400x520 -->
<svg id="lamp" class="plate" width="1400" height="520" viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9efe9" stop-opacity=".62"/><stop offset=".55" stop-color="#cfe2dc" stop-opacity=".18"/><stop offset="1" stop-color="#cfe2dc" stop-opacity="0"/></linearGradient>
    <radialGradient id="pool" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#cfe2dc" stop-opacity=".22"/><stop offset="1" stop-color="#cfe2dc" stop-opacity="0"/></radialGradient>
    <filter id="cblur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="dust" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.003 0.006" numOctaves="3" seed="21" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.95  0 0 0 0 0.93  0 0 0 1.4 -0.5"/><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="grain2"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer></filter>
    <clipPath id="conec"><polygon points="700,0 60,520 1340,520"/></clipPath>
  </defs>
  <rect width="1400" height="520" fill="#0B0C0F"/>
  <g filter="url(#cblur)"><polygon points="700,-40 20,560 1380,560" fill="url(#cone)"/></g>
  <g clip-path="url(#conec)"><rect width="1400" height="520" filter="url(#dust)" opacity=".32" style="mix-blend-mode:screen"/></g>
  <rect width="1400" height="520" fill="url(#pool)"/>
  <!-- lamp shade rim, a shallow dark ellipse at top -->
  <ellipse cx="700" cy="-6" rx="150" ry="16" fill="#07080a"/>
  <ellipse cx="700" cy="-6" rx="150" ry="16" fill="none" stroke="#4BB394" stroke-opacity=".5"/>
  <rect width="1400" height="520" filter="url(#grain2)" style="mix-blend-mode:overlay"/>
</svg>
